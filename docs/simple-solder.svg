<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Simple wiring</title>
  <desc id="desc">Every module and hookup wire for the simple circuit. Each cable uses its own lane and only touches the pad it solders to. No power-path PCB.</desc>

  <rect width="1600" height="1100" fill="#f4f0e6"/>
  <text x="800" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1c1c">Simple wiring</text>
  <text x="800" y="56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#444">No power-path PCB. Each numbered cable has its own lane. Connect the LiPo last. Charge with the device off.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    <rect x="1188" y="12" width="392" height="50" rx="8" fill="#fff" stroke="#cfc8b8"/>
    <rect x="1202" y="26" width="26" height="8" rx="2" fill="#c62828"/><text x="1234" y="34" fill="#333">red USB / cell+ / VOUT</text>
    <rect x="1408" y="26" width="26" height="8" rx="2" fill="#ef6c00"/><text x="1440" y="34" fill="#333">orange OUT+ / VIN</text>
    <rect x="1202" y="44" width="26" height="8" rx="2" fill="#212121"/><text x="1234" y="52" fill="#333">black GND</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="20" y="78" width="200" height="112" rx="12" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
    <text x="120" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#37474f">902030 LiPo</text>
    <text x="120" y="124" text-anchor="middle" font-size="12" fill="#607d8b">3.7 V  500 mAh  connect last</text>
    <rect x="36" y="146" width="72" height="28" rx="5" fill="#c62828"/>
    <text x="72" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">BAT+</text>
    <rect x="132" y="146" width="72" height="28" rx="5" fill="#212121"/>
    <text x="168" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">BAT-</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="20" y="400" width="200" height="200" rx="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
    <text x="120" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1c1c">USB-C socket</text>
    <rect x="60" y="440" width="120" height="32" rx="9" fill="#263238"/>
    <rect x="80" y="448" width="80" height="16" rx="5" fill="#111"/>
    <rect x="36" y="492" width="76" height="32" rx="5" fill="#c62828"/>
    <text x="74" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">VBUS</text>
    <rect x="128" y="492" width="76" height="32" rx="5" fill="#212121"/>
    <text x="166" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">GND</text>
    <text x="120" y="578" text-anchor="middle" font-size="11" fill="#666">power pins only</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="300" y="380" width="260" height="230" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="1.8"/>
    <rect x="316" y="380" width="72" height="30" rx="5" fill="#c62828"/><text x="352" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">IN+</text>
    <rect x="394" y="380" width="72" height="30" rx="5" fill="#c62828"/><text x="430" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">BAT+</text>
    <rect x="472" y="380" width="72" height="30" rx="5" fill="#ef6c00"/><text x="508" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">OUT+</text>
    <circle cx="352" cy="428" r="6" fill="#e53935"/>
    <circle cx="372" cy="428" r="6" fill="#1e88e5"/>
    <text x="430" y="456" text-anchor="middle" font-size="15" font-weight="700" fill="#5d4037">TP4057 charger</text>
    <text x="430" y="474" text-anchor="middle" font-size="11" fill="#8d6e63">match the labels on your board</text>
    <rect x="316" y="580" width="72" height="30" rx="5" fill="#212121"/><text x="352" y="600" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">IN-</text>
    <rect x="394" y="580" width="72" height="30" rx="5" fill="#212121"/><text x="430" y="600" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">BAT-</text>
    <rect x="472" y="580" width="72" height="30" rx="5" fill="#212121"/><text x="508" y="600" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">OUT-</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="720" y="400" width="150" height="190" rx="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
    <text x="795" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1c1c">Slide switch</text>
    <rect x="754" y="444" width="82" height="24" rx="7" fill="#37474f"/>
    <rect x="794" y="448" width="24" height="16" rx="3" fill="#cfd8dc"/>
    <circle cx="752" cy="568" r="10" fill="#9e9e9e" stroke="#333"/>
    <circle cx="795" cy="568" r="10" fill="#ef6c00" stroke="#333"/>
    <circle cx="838" cy="568" r="10" fill="#ef6c00" stroke="#333"/>
    <text x="752" y="552" text-anchor="middle" font-size="11" fill="#888">nc</text>
    <text x="795" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#e65100">middle</text>
    <text x="838" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#e65100">right</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="1040" y="380" width="140" height="220" rx="12" fill="#0d47a1" stroke="#0a3476" stroke-width="1.8"/>
    <text x="1110" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">TPS63802</text>
    <text x="1110" y="424" text-anchor="middle" font-size="11" fill="#bbdefb">buck-boost</text>
    <rect x="1060" y="444" width="100" height="28" rx="5" fill="#ef6c00"/><text x="1110" y="463" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">VIN</text>
    <rect x="1060" y="486" width="100" height="28" rx="5" fill="#212121"/><text x="1110" y="505" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">GND</text>
    <rect x="1060" y="528" width="100" height="28" rx="5" fill="#c62828"/><text x="1110" y="547" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">VOUT</text>
    <text x="1110" y="582" text-anchor="middle" font-size="11" fill="#bbdefb">3.0 V or 3.3 V</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="1360" y="400" width="136" height="200" rx="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
    <text x="1428" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1c1c">Host</text>
    <text x="1428" y="444" text-anchor="middle" font-size="11" fill="#666">left springs P6 / P7</text>
    <rect x="1384" y="464" width="88" height="30" rx="5" fill="#c62828"/><text x="1428" y="484" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">+</text>
    <rect x="1384" y="516" width="88" height="30" rx="5" fill="#212121"/><text x="1428" y="536" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">-</text>
    <text x="1428" y="578" text-anchor="middle" font-size="11" fill="#888">screen facing you</text>
  </g>

  <path d="M112 492 H210 V246 H352 V380" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="112" cy="492" r="4" fill="#c62828"/>
  <circle cx="210" cy="246" r="4" fill="#c62828"/>
  <circle cx="352" cy="380" r="4" fill="#c62828"/>
  <circle cx="40" cy="246" r="10" fill="#c62828"/>
  <text x="40" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>
  <text x="220" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c62828">USB VBUS to TP4057 IN+</text>

  <path d="M72 174 V204 H430 V380" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="204" r="10" fill="#c62828"/>
  <text x="160" y="208" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">4</text>
  <text x="174" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c62828">LiPo + to BAT+</text>

  <path d="M168 174 V188 H16 V640 H430 V610" fill="none" stroke="#212121" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="330" r="10" fill="#212121"/>
  <text x="16" y="334" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">5</text>
  <text x="30" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#212121">LiPo - to BAT-</text>

  <path d="M544 395 H620 V640 H795 V568" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="680" cy="640" r="10" fill="#ef6c00"/>
  <text x="680" y="644" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>
  <text x="700" y="630" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">OUT+ to switch middle</text>

  <path d="M838 568 H950 V458 H1060" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="950" cy="500" r="10" fill="#ef6c00"/>
  <text x="950" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">6</text>
  <text x="900" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">right to VIN</text>

  <path d="M1160 542 H1260 V479 H1384" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1260" cy="510" r="10" fill="#c62828"/>
  <text x="1260" y="514" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">7</text>
  <text x="1224" y="580" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c62828">VOUT to host +</text>

  <path d="M204 508 H260 V595 H316" fill="none" stroke="#212121" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="204" cy="508" r="4" fill="#212121"/>
  <circle cx="316" cy="595" r="4" fill="#212121"/>
  <circle cx="260" cy="550" r="10" fill="#212121"/>
  <text x="260" y="554" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>
  <text x="268" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#212121">USB GND to IN-</text>

  <path d="M508 610 V680 H1000 V500 H1060" fill="none" stroke="#212121" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="508" cy="610" r="4" fill="#212121"/>
  <circle cx="1060" cy="500" r="4" fill="#212121"/>
  <circle cx="860" cy="680" r="10" fill="#212121"/>
  <text x="860" y="684" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">8</text>
  <text x="880" y="670" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#212121">OUT- to TPS GND</text>

  <path d="M1160 500 H1220 V531 H1384" fill="none" stroke="#212121" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1160" cy="500" r="4" fill="#212121"/>
  <circle cx="1384" cy="531" r="4" fill="#212121"/>
  <circle cx="1220" cy="548" r="10" fill="#212121"/>
  <text x="1220" y="552" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">9</text>
  <text x="1234" y="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#212121">TPS GND to host -</text>

  <rect x="20" y="770" width="1560" height="310" rx="10" fill="#fff" stroke="#d4cdb8"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#222">
    <text x="40" y="800" font-size="15" font-weight="700">Cable list  (solder 1 to 3, then 6 to 9, then 4 and 5 last)</text>
    <text x="40" y="832"><tspan font-weight="700" fill="#c62828">1</tspan>  USB VBUS  to  TP4057 IN+</text>
    <text x="40" y="860"><tspan font-weight="700">2</tspan>  USB GND  to  TP4057 IN-</text>
    <text x="40" y="888"><tspan font-weight="700" fill="#ef6c00">3</tspan>  TP4057 OUT+  to  switch middle</text>
    <text x="40" y="916"><tspan font-weight="700" fill="#c62828">4</tspan>  LiPo +  to  TP4057 BAT+</text>
    <text x="40" y="944"><tspan font-weight="700">5</tspan>  LiPo -  to  TP4057 BAT-</text>
    <text x="40" y="972"><tspan font-weight="700" fill="#ef6c00">6</tspan>  switch right  to  TPS VIN     <tspan font-weight="700" fill="#c62828">7</tspan>  TPS VOUT  to  host +</text>
    <text x="40" y="1000"><tspan font-weight="700">8</tspan>  TP4057 OUT-  to  TPS63802 GND     <tspan font-weight="700">9</tspan>  TPS63802 GND  to  host -</text>
    <text x="40" y="1036" font-size="13" fill="#555">GND is a chain, not one rail: USB GND to IN-, then OUT- to TPS GND, then TPS GND to host -. Host + / - are the leftover left springs.</text>
    <text x="40" y="1064" font-size="13" fill="#555">Turn the Tamagotchi off while charging. USB and the load share the same OUT node on this version.</text>
  </g>
</svg>
